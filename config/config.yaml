# =============================================================================
# Retail Inventory Intelligence Platform - Data Generation Config
# -----------------------------------------------------------------------------
# Every tunable lives here. Nothing is hard-coded in the scripts.
# Switch `active_profile` to run a fast demo or the full 5-year dataset.
# =============================================================================

seed: 42                       # fixed seed => fully reproducible dataset
active_profile: "demo"         # "demo" (fast, laptop) or "full" (production-scale)

date_range:
  start: "2021-01-01"
  end:   "2025-12-31"

# Business thresholds (also consumed by SQL / DAX so definitions stay consistent)
business_rules:
  carrying_cost_rate: 0.25     # 25% annual carrying cost of inventory value
  dead_stock_days: 180         # no movement beyond this => dead stock
  default_service_level: 0.95  # target in-stock service level

# Deliberate, documented data-quality issues injected into the RAW layer only.
# These are cleaned in staging so the cleaning/validation deliverables do real work.
data_quality:
  inject_missing_pct:   0.010  # ~1% of nullable cells blanked
  inject_duplicate_pct: 0.004  # ~0.4% of sales rows duplicated

output:
  format: "csv"                # csv | parquet
  raw_path:    "data/raw"
  sample_path: "data/samples"
  sample_rows: 500             # rows written to committed samples

# -----------------------------------------------------------------------------
# PROFILES
# -----------------------------------------------------------------------------
profiles:

  full:                        # the locked spec: 5 years, real behaviour
    products:   50000
    suppliers:  250
    stores:     120
    warehouses: 8
    employees:  1500
    customers:  50000
    promotions: 120            # ~24 campaigns/year over 5 years
    target_sales_rows: 1200000
    # stocking breadth: how many locations an average SKU is stocked in
    avg_locations_per_product: 6
    # simulation window: daily snapshots for the recent window, month-end before
    daily_snapshot_months: 18  # most-recent months kept at DAILY grain

  demo:                        # small, fast — used to validate the pipeline
    products:   800
    suppliers:  40
    stores:     8
    warehouses: 2
    employees:  120
    customers:  2000
    promotions: 12
    target_sales_rows: 40000
    avg_locations_per_product: 3
    daily_snapshot_months: 4
    demo_days: 120             # demo simulates a short window for speed
